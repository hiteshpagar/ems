spring.datasource.url=jdbc:mysql://localhost:3306/ems_db

spring.datasource.username=${DB_USERNAME:ems_user}
spring.datasource.password=${DB_PASSWORD:ems@123}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080

logging.level.org.springframework.security=TRACE

# SMTP
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:admin@ems.com}
spring.mail.password=${MAIL_PASSWORD:secret}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

app.mail.from=${MAIL_FROM:noreply@ems.com}
app.mail.enabled=${MAIL_ENABLED:false}

app.password-reset.otp-expiry-minutes=${PASSWORD_RESET_OTP_EXPIRY_MINUTES:10}